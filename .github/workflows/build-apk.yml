name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME).
      - name: Build debug APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShelfCounterDemo.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShelfCounterDemo-apk
          path: ShelfCounterDemo.apk

      - name: Publish APK as a GitHub release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo ShelfCounterDemo.apk \
            --title "Shelf Counter demo" \
            --notes "Debug-signed demo APK built from ${GITHUB_SHA}. Install on Android 8.0+ (tested target: Samsung Galaxy A56, Android 15)."
